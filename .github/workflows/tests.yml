name: ArguMind Tests

on:
  push:
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: argumind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d argumind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database tables
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/argumind
        run: |
          python -m db.create_tables

      - name: Run persistent memory integration test
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/argumind
        run: |
          python -m tests.test_persistent_memory_service